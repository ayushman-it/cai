<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Profile — Onboarding — CuboidPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/dashboard.css?v=5.0.0">
</head>
<body class="bg-[#fcfbfa] text-[#111111] antialiased flex flex-col justify-between min-h-screen">

  <header class="sticky top-0 z-40 w-full px-5 py-2.5 sm:py-3 border-b border-[#e7e5de] bg-white flex items-center justify-between shrink-0">
    <a href="../index.html" class="flex items-center gap-2 text-[#111111] no-underline">
      <div class="w-6 h-6 flex items-center justify-center overflow-hidden shrink-0">
        <img src="../assets/logo-black.png" alt="CuboidPilot" class="w-full h-full object-contain">
      </div>
      <span class="text-sm font-semibold tracking-tight text-[#111111]">CuboidPilot</span>
    </a>

    <!-- Top Right Action -->
    <div class="flex items-center gap-2 sm:gap-2.5">
      <span class="text-xs text-stone-500 hidden sm:inline">Already have an account?</span>
      <a href="../login.php" class="inline-flex items-center justify-center text-xs font-medium text-stone-900 border border-stone-900 px-3 py-1 rounded-[4px] hover:bg-stone-50 transition-colors">
        Log in
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 min-h-0">
    <div class="w-full max-w-[500px] bg-white border border-[#e7e5de] rounded-[6px] p-5 sm:p-8 shadow-xs my-auto">
      
      <div class="mb-6">
        <span class="text-[11px] font-semibold uppercase tracking-wider text-stone-400 block mb-1">Company Setup</span>
        <h1 class="text-2xl font-medium tracking-tight text-[#111111]">Tell us about your business</h1>
        <p class="text-xs text-stone-500 mt-1">This helps CuboidPilot tailor its conversational persona and lead scoring logic.</p>
      </div>

      <form action="goals.html" method="GET" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-stone-700 mb-1.5">Business Name</label>
          <input type="text" value="Acme Academy" required class="app-input w-full" placeholder="e.g. Acme Academy">
        </div>

        <div>
          <label class="block text-xs font-medium text-stone-700 mb-1.5">Website URL</label>
          <input type="url" value="https://acmeacademy.com" required class="app-input w-full" placeholder="https://yourwebsite.com">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-stone-700 mb-1.5">Industry</label>
            <select class="app-select w-full">
              <option selected>Education &amp; Academies</option>
              <option>SaaS &amp; Software</option>
              <option>Healthcare &amp; Clinics</option>
              <option>Real Estate</option>
              <option>E-commerce / Retail</option>
              <option>Agency / Services</option>
              <option>Professional Services</option>
              <option>Other</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-stone-700 mb-1.5">Business Model</label>
            <select class="app-select w-full">
              <option selected>B2C / Student Training</option>
              <option>B2B Enterprise</option>
              <option>D2C Product Sales</option>
              <option>Consulting &amp; Advisory</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-stone-700 mb-1.5">Country</label>
            <select class="app-select w-full">
              <option selected>India</option>
              <option>United States</option>
              <option>United Kingdom</option>
              <option>United Arab Emirates</option>
              <option>Singapore</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-stone-700 mb-1.5">Timezone</label>
            <select class="app-select w-full">
              <option selected>Asia/Kolkata (GMT+5:30)</option>
              <option>America/New_York (EST)</option>
              <option>Europe/London (GMT)</option>
              <option>Asia/Dubai (GST)</option>
            </select>
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" class="btn-primary w-full py-2.5 text-xs font-medium">
            Continue to Business Goals &rarr;
          </button>
        </div>
      </form>

    </div>
  </main>

  <footer class="py-4 text-center text-xs text-stone-400 border-t border-[#e7e5de] bg-white">
    Step 1 of 6 • You can modify company details in settings anytime.
  </footer>

  <script>
    if (window.lucide) window.lucide.createIcons();
  </script>
</body>
</html>
